  <rect x="319" y="248" width="11" height="4" rx="1" fill="#7F8C8D"/>
  <path d="M325 215 Q325 205 315 205" stroke="#7F8C8D" stroke-width="3" fill="none"/>
  <ellipse cx="314" cy="203" rx="7" ry="5" fill="#FFF9C4" opacity="0.9"/>
